<!DOCTYPE html>
<html lang="fi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SiNG BOX | Room Service</title>

    <link
        rel="stylesheet"
        href="tablet_customer.css"
    >

</head>


<body>

    <main id="customerApp">

        <header class="tablet-header">

           <div class="tablet-logo">

    <div class="tablet-brand">
        SiNG BOX
    </div>

    <div class="tablet-subtitle">
        <span></span>
        NORAEBANG
        <span></span>
    </div>

</div>
            <div
                class="room-name"
                id="roomName"
            >
                Room
            </div>

        </header>


        <section class="tablet-intro">

            <h1>
                Order to your room
            </h1>

            <p>
                Choose your food and drinks.
            </p>

        </section>


        <section
            class="tablet-menu"
            id="tabletMenu"
        >
            <!-- Products will be loaded from Supabase -->
        </section>


        <button
            class="cart-button"
            id="cartButton"
            type="button"
        >
            Cart
            <span id="cartCount">0</span>
        </button>

        <!-- =====================================================
     CART PANEL
===================================================== -->

<div
    class="cart-overlay"
    id="cartOverlay"
    hidden
>

    <div class="cart-panel">

        <div class="cart-header">

            <div>
                <div class="cart-eyebrow">
                    YOUR ORDER
                </div>

                <h2>
                    Ostoskori
                </h2>
            </div>

            <button
                class="cart-close"
                id="cartClose"
                type="button"
                aria-label="Sulje ostoskori"
            >
                ×
            </button>

        </div>


        <div
            class="cart-items"
            id="cartItems"
        >
        </div>


        <div class="cart-summary">

            <div class="cart-total-row">

                <span>
                    Yhteensä
                </span>

                <strong id="cartTotal">
                    0.00 €
                </strong>

            </div>


            <button
                class="send-order-button"
                type="button"
                disabled
            >
                Lähetä tilaus
            </button>

            <p class="order-disabled-note">
                Tilauksen lähetys otetaan käyttöön
                laitteen tunnistautumisen jälkeen.
            </p>

        </div>

    </div>

</div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="tablet_customer.js"></script>

</body>

</html>
