<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#00130e">
  <meta name="description" content="SiNG BOX Noraebang - verkkosivua päivitetään. Palaamme pian.">
  <title>Verkkosivua päivitetään | SiNG BOX Noraebang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --night: #000b08;
      --green: #001b14;
      --cream: #f0dcb5;
      --gold: #d7a846;
      --pink: #ff2f92;
      --text: #f7f2e8;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 54% 47% at 50% 43%, rgba(2, 54, 36, .72), transparent 80%),
        radial-gradient(circle at 87% 7%, rgba(215, 168, 70, .065), transparent 30%),
        var(--night);
      color: var(--text);
      font-family: "Outfit", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 18px;
      border: 1px solid rgba(215, 168, 70, .15);
      pointer-events: none;
      z-index: 1;
    }
    .maintenance {
      position: relative;
      width: min(720px, calc(100% - 60px));
      padding: clamp(50px, 8vw, 92px) 0;
      text-align: center;
    }
    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      color: var(--cream);
      text-decoration: none;
      user-select: none;
    }
    .brand-name {
      font-weight: 500;
      font-size: clamp(38px, 7.5vw, 69px);
      letter-spacing: .025em;
      line-height: 1;
      white-space: nowrap;
    }
    .brand-subline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      width: 100%;
    }
    .brand-rule {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(215,168,70,.75));
    }
    .brand-rule:last-child {
      background: linear-gradient(90deg, rgba(215,168,70,.75), transparent);
    }
    .brand-subtitle {
      font-size: clamp(9px, 1.8vw, 11px);
      letter-spacing: .38em;
      color: var(--gold);
      font-weight: 500;
      padding-left: .38em;
    }
    .separator {
      width: 1px;
      height: clamp(65px, 9vw, 90px);
      background: linear-gradient(180deg, rgba(215,168,70,.7), rgba(215,168,70,.03));
      margin: clamp(39px, 6vw, 60px) auto 25px;
    }
    .eyebrow {
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: .27em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--cream);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(49px, 10vw, 88px);
      line-height: .98;
      letter-spacing: -.018em;
    }
    h1 .dot { color: var(--pink); }
    .description {
      max-width: 460px;
      margin: 26px auto 0;
      color: rgba(247,242,232,.79);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.75;
      font-weight: 300;
    }
    .english {
      max-width: 460px;
      margin: 15px auto 0;
      color: rgba(247,242,232,.52);
      font-size: 13px;
      line-height: 1.7;
      font-weight: 300;
    }
    .bottom {
      margin-top: clamp(50px, 8vw, 80px);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      color: rgba(215,168,70,.7);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .bottom::before, .bottom::after {
      content: "";
      width: 26px;
      height: 1px;
      background: rgba(215,168,70,.32);
    }
    @media (max-width: 480px) {
      body::before { inset: 10px; }
      .maintenance { width: min(100% - 42px, 440px); }
      .brand-subtitle { letter-spacing: .3em; padding-left: .3em; }
      .description { margin-top: 20px; }
    }
  </style>
</head>
<body>
  <main class="maintenance" role="main">
    <div class="brand" aria-label="SiNG BOX Noraebang">
      <span class="brand-name">SiNG BOX</span>
      <span class="brand-subline" aria-hidden="true">
        <span class="brand-rule"></span>
        <span class="brand-subtitle">NORAEBANG</span>
        <span class="brand-rule"></span>
      </span>
    </div>

    <div class="separator" aria-hidden="true"></div>
    <p class="eyebrow">Hetkinen, viimeistelemme sivustoa</p>
    <h1>Verkkosivua<br>päivitetään<span class="dot">.</span></h1>
    <p class="description">Teemme sivustoon parannuksia. Palaamme pian — kiitos kärsivällisyydestä!</p>
    <p class="english" lang="en">Our website is being updated. We'll be back soon. Thank you for your patience.</p>
    <div class="bottom" aria-hidden="true">SiNG BOX · Noraebang</div>
  </main>
</body>
</html>
