<!DOCTYPE html>
<html lang="fi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SiNG BOX | Staff</title>

    <link
        rel="stylesheet"
        href="tablet_staff.css"
    >

</head>


<body>

    <main id="staffApp">

        <!-- HEADER -->

        <header class="staff-header">

            <div class="tablet-logo">

                <div class="tablet-brand">
                    SiNG BOX
                </div>

                <div class="tablet-subtitle">
                    <span></span>
                    NORAEBANG
                    <span></span>
                </div>

            </div>


            <div class="staff-header-info">

                <div class="staff-label">
                    STAFF
                </div>

                <div
                    class="staff-clock"
                    id="staffClock"
                >
                    --:--
                </div>

            </div>

        </header>


        <!-- TITLE -->

        <section class="staff-intro">

            <div class="staff-eyebrow">
                ROOM SERVICE
            </div>

            <h1>
                Huoneet
            </h1>

            <p>
                Varaukset, tilaukset ja henkilökuntakutsut
            </p>

        </section>


        <!-- ROOMS -->

        <section
            class="staff-rooms"
            id="staffRooms"
        >

            <!-- Huoneet ja niiden tiedot
                 ladataan myöhemmin Supabasesta -->

        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="tablet_staff.js"></script>

</body>

</html>
