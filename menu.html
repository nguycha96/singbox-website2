<!DOCTYPE html>
<html lang="fi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SiNG BOX Noraebang – ruoka, juomat ja tarjoukset."
    >

    <title>Menu | SiNG BOX Noraebang</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style-new.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <div class="header-inner">

        <a
            href="index.html"
            class="logo"
            aria-label="SiNG BOX Noraebang"
        >

            <span class="logo-main">
                SiNG BOX
            </span>

            <span class="logo-bottom">

                <span class="logo-line"></span>

                <span class="logo-sub">
                    NORAEBANG
                </span>

                <span class="logo-line"></span>

            </span>

        </a>


        <nav
            class="main-nav"
            aria-label="Main navigation"
        >

            <a
                href="index.html"
                data-i18n="nav.home"
            >
                Etusivu
            </a>

            <a
                href="index.html#rooms"
                data-i18n="nav.rooms"
            >
                Huoneet
            </a>

            <a
                href="menu.html"
                class="active"
                data-i18n="nav.food"
            >
                Ruoka & juomat
            </a>

            <a
                href="index.html#about"
                data-i18n="nav.about"
            >
                Meistä
            </a>

            <a
                href="index.html#contact"
                data-i18n="nav.contact"
            >
                Yhteystiedot
            </a>

        </nav>


        <div class="header-right">

            <div
                class="language-switcher"
                aria-label="Language"
            >

                <button
                    type="button"
                    class="lang-btn active"
                    data-lang="fi"
                >
                    FI
                </button>

                <span class="language-divider">
                    |
                </span>

                <button
                    type="button"
                    class="lang-btn"
                    data-lang="en"
                >
                    EN
                </button>

            </div>


            <a
                href="booking.html"
                class="header-book"
            >

                <span data-i18n="common.bookNow">
                    Varaa nyt
                </span>

                <span class="button-arrow">
                    →
                </span>

            </a>

        </div>


        <button
            class="menu-toggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
        >

            <span></span>
            <span></span>

        </button>

    </div>

</header>


<main>


<!-- =====================================================
     MENU
===================================================== -->

<section
    class="menu-section"
    id="menu"
>

    <div class="menu-heading">

        <p
            class="eyebrow"
            data-i18n="menu.eyebrow"
        >
            Jotain pöytään
        </p>

        <h1 data-i18n="menu.title">
            Menu
        </h1>

        <p data-i18n="menu.text">
            Ruokaa, juomia ja jotain makeaa.
        </p>

    </div>


    <!-- OFFERS FROM SUPABASE -->

    <div
        class="offers-area"
        id="offersArea"
        hidden
    ></div>


    <!-- SATURDAY BRUNCH
         rakennetaan tähän myöhemmin -->


    <!-- PRODUCTS FROM SUPABASE -->

    <div
        class="menu-grid"
        id="menuGrid"
    >

        <!-- Products are loaded from Supabase -->

    </div>

</section>


</main>


<!-- =====================================================
     SUPABASE + MENU SCRIPT
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="menu.js"></script>


</body>
</html>
